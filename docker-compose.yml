version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-qdrant
    ports:
      - ${QDRANT_PORT:-6333}:${QDRANT_PORT:-6333}
      - ${QDRANT_PORT_SSL:-6334}:${QDRANT_PORT_SSL:-6334}
    volumes:
      - ./qdrant:/qdrant/storage
    networks:
      - chatbot-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-app
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:${QDRANT_PORT:-6333}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./database:/app/database
    ports:
      - ${UVICORN_PORT:-8000}:${UVICORN_PORT:-8000}
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot-net

  ui:
    build:
      context: ./chatbot-ui
      dockerfile: Dockerfile
    container_name: chatbot-ui
    ports:
      - ${UI_PORT:-3000}:80
    depends_on:
      - app
    networks:
      - chatbot-net

networks:
  chatbot-net:
    driver: bridge